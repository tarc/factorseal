[package]
name = "factorseal-setup"
# The installer's own version: it changes only when the installer gains a
# capability (docs/plans/windows-installer.md), never per FactorSeal release.
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Per-user Windows installer for FactorSeal, driven by a release manifest"
repository = "https://github.com/cachix/factorseal"
publish = false

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sha2 = "0.10.9"
thiserror = "2.0.12"

[dev-dependencies]
tempfile = "3.20.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
