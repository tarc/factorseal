[package]
name = "factorseal-setup"
# The installer's own version: it changes only when the installer gains a
# capability (docs/plans/windows-installer.md), never per FactorSeal release.
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Per-user Windows installer for FactorSeal, driven by a release manifest"
repository = "https://github.com/cachix/factorseal"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sha2 = "0.10.9"
# The processes holding the install folder, through a safe API.
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
thiserror = "2.0.12"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"
# The task dialogs (src/dialog.rs, the binary's one module allowed unsafe
# code).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# The application manifest (Common Controls 6, for task dialogs) and icon.
embed-resource = "3.0.11"

[dev-dependencies]
tempfile = "3.20.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
